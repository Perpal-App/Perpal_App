#:schema node_modules/wrangler/config-schema.json

# PerPal RPC gateway.
#
# One deployment per target, each with its own name and its own secret store, so a
# devnet request cannot reach mainnet credentials. There is deliberately no
# top-level default environment: deploys must name a target explicitly.

name = "perpal-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Preview URLs are off. Every preview URL is a public, unauthenticated endpoint
# bound to the same provider secrets as production, so each one widens the attack
# surface for no benefit here. Versions are still testable via `wrangler dev`.
preview_urls = false

# --- devnet -----------------------------------------------------------------
# workers.dev is enabled here so devnet has a working URL without a custom domain.
# Mainnet leaves it off, so production must be attached to a domain deliberately.
[env.devnet]
name = "perpal-gateway-devnet"
workers_dev = true

[env.devnet.vars]
SOLANA_CLUSTER = "devnet"
PERPS_VENUE = "drift-devnet"

# Secrets (set manually, never committed):
#   npx wrangler secret put HELIUS_API_KEY --env devnet
#   npx wrangler secret put ALCHEMY_API_KEY --env devnet
#   npx wrangler secret put UPSTASH_REDIS_REST_URL --env devnet
#   npx wrangler secret put UPSTASH_REDIS_REST_TOKEN --env devnet

# --- mainnet ----------------------------------------------------------------
[env.mainnet]
name = "perpal-gateway-mainnet"
workers_dev = false

[env.mainnet.vars]
SOLANA_CLUSTER = "mainnet"
PERPS_VENUE = "flash-mainnet"

# Secrets (set manually, never committed):
#   npx wrangler secret put HELIUS_API_KEY --env mainnet
#   npx wrangler secret put ALCHEMY_API_KEY --env mainnet
#   npx wrangler secret put UPSTASH_REDIS_REST_URL --env mainnet
#   npx wrangler secret put UPSTASH_REDIS_REST_TOKEN --env mainnet
