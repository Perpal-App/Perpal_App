#:schema node_modules/wrangler/config-schema.json

# Android mainnet prototype gateway. The public market route has no wallet
# requirement; RPC writes remain signed, rate-limited, and idempotent.
name = "perpal-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
preview_urls = false

[env.mainnet]
name = "perpal-gateway-mainnet"
workers_dev = true
compatibility_flags = ["global_fetch_strictly_public"]

[env.mainnet.vars]
SOLANA_CLUSTER = "mainnet"
PERPS_PROVIDERS = "pacifica"
CORS_ALLOWED_ORIGINS = ""
PYTH_HERMES_ORIGIN = "https://hermes.pyth.network"
PYTH_MARKET_FEEDS = "BTC:e62df6c8b4a85fe1a67db44dc12de5db330f7ac66b72dc658afedf0f4a415b43,ETH:ff61491a931112ddf1bd8147cd1b641375f79f5825126d665480874634fd0ace,SOL:ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d"
FEAR_GREED_URL = "https://api.alternative.me/fng/?limit=1&format=json"
COINDESK_NEWS_FEED_URL = "https://www.coindesk.com/arc/outboundfeeds/rss/"
MARKETWATCH_NEWS_FEED_URL = "https://feeds.content.dowjones.io/public/rss/mw_topstories"
FED_MONETARY_NEWS_FEED_URL = "https://www.federalreserve.gov/feeds/press_monetary.xml"
USD_ECONOMIC_CALENDAR_URL = "https://api.fxmacrodata.com/v1/calendar/usd"
JUPITER_API_ORIGIN = "https://api.jup.ag"
STABLECOIN_MINTS = "USDC:EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v,USDT:Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"

[[env.mainnet.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2102"

[env.mainnet.ratelimits.simple]
limit = 120
period = 60

[[env.mainnet.ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "2104"

[env.mainnet.ratelimits.simple]
limit = 3000
period = 60

[[env.mainnet.analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "perpal_gateway_mainnet"

# Secrets (set manually, never committed):
#   npx wrangler secret put HELIUS_API_KEY --env mainnet
#   npx wrangler secret put ALCHEMY_API_KEY --env mainnet
#   npx wrangler secret put UPSTASH_REDIS_REST_URL --env mainnet
#   npx wrangler secret put UPSTASH_REDIS_REST_TOKEN --env mainnet
#   npx wrangler secret put PYTH_API_KEY --env mainnet
#   npx wrangler secret put JUPITER_API_KEY --env mainnet
